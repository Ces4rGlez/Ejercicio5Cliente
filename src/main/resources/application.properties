spring.application.name=Ejercicio5Cliente
server.port=${PORT:10000}
backend.service.url=${BACKEND_SERVICE_URL:${BACKEND_URL:https://localhost:8081}}

# Actuator & Prometheus Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=ejercicio5-frontend



